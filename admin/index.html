<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YPP Admin Panel</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="admin-layout.css">
    
    <!-- Font Awesome -->
    <script src="https://kit.fontawesome.com/e4704dcbbd.js" crossorigin="anonymous"></script>
    <script src="admin-layout.js" defer></script>

    <!-- Style -->
    <style>
        :root {
            --admin-max-width: 1160px;
            --admin-background: #f4f6f8;
            --admin-surface: #ffffff;
            --admin-text: #1f2933;
            --admin-muted: #667085;
            --admin-border: #d9e0e7;
            --admin-primary: #0066cc;
            --admin-primary-soft: #edf6ff;
            --admin-danger: #d92d20;
        }

        body {
            min-height: 100dvh;
            background: var(--admin-background);
            color: var(--admin-text);
        }

        p,
        span {
            margin-bottom: 0;
        }

        .main-container {
            max-width: var(--admin-max-width);
            margin: 0 auto;
            padding: 32px 24px 56px;
            box-sizing: border-box;
        }

        .admin-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            padding: 0 0 24px;
            border-bottom: 1px solid var(--admin-border);
        }

        .admin-eyebrow {
            margin: 0 0 6px;
            color: var(--admin-primary);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.08em;
        }

        .admin-title {
            margin: 0;
            color: var(--admin-text);
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 0;
        }

        .admin-user {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-info {
            display: none;
        }

        .header-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            padding: 0;
            border: 1px solid var(--admin-border);
            border-radius: 6px;
            background: var(--admin-surface);
            color: var(--admin-muted);
            cursor: pointer;
            transition: border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease;
        }

        .header-action:hover,
        .header-action:focus-visible {
            border-color: var(--admin-primary);
            background: var(--admin-primary-soft);
            color: var(--admin-primary);
        }

        .header-action:focus-visible,
        .nav-card:focus-visible {
            outline: 2px solid var(--admin-primary);
            outline-offset: 2px;
        }

        .logout-btn {
            color: var(--admin-danger);
        }
        
        /* 로딩 스크린 */
        .auth-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--admin-background);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        
        .auth-loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e3e3e3;
            border-top: 4px solid #0066cc;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .dashboard-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 8px 0 0;
            color: var(--admin-muted);
            font-size: 0.85rem;
        }

        .dashboard-meta i {
            color: var(--admin-primary);
        }

        .nav-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 32px;
            margin-top: 32px;
        }

        .admin-section {
            min-width: 0;
        }

        .nav-title {
            margin: 0 0 12px;
            color: var(--admin-text);
            font-size: 1rem;
            font-weight: 700;
        }

        .nav-title-action {
            margin-left: 4px;
            padding: 2px;
            border: 0;
            background: transparent;
            color: var(--admin-muted);
            cursor: pointer;
        }

        .nav-title-action:hover,
        .nav-title-action:focus-visible {
            color: var(--admin-primary);
        }

        .nav-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-grid-single {
            grid-template-columns: 1fr;
        }

        .nav-card {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-height: 92px;
            padding: 16px;
            border: 1px solid var(--admin-border);
            border-radius: 8px;
            background: var(--admin-surface);
            color: inherit;
            text-align: left;
            cursor: pointer;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
        }

        .nav-card:hover {
            border-color: #9cc8ef;
            box-shadow: 0 4px 12px rgba(16, 24, 40, 0.08);
            transform: translateY(-1px);
        }

        .nav-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 6px;
            background: var(--admin-primary-soft);
            color: var(--admin-primary);
            font-size: 1rem;
        }

        .nav-name {
            margin: 0;
            color: var(--admin-text);
            font-size: 0.95rem;
            font-weight: 700;
        }

        .nav-description {
            margin: 5px 0 0;
            color: var(--admin-muted);
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .nav-info {
            text-align: right;
        }

        .nav-count {
            color: var(--admin-text);
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .nav-count .fa-spinner {
            color: var(--admin-muted);
        }

        .links {
            position: fixed;
            right: 24px;
            bottom: 24px;
        }

        .links a img {
            width: 2.25rem;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgb(0 0 0 / 18%);
        }

        @media screen and (max-width: 760px) {
            .main-container {
                padding: 24px 16px 48px;
            }

            .admin-header {
                gap: 16px;
            }

            .admin-title {
                font-size: 1.45rem;
            }

            .nav-container {
                grid-template-columns: 1fr;
                gap: 28px;
            }
        }

        @media screen and (max-width: 480px) {
            .nav-grid {
                grid-template-columns: 1fr;
            }

            .header-action {
                width: 2.25rem;
                height: 2.25rem;
            }
        }
    </style>
</head>
<body>

<script>
// FAQ 모달 열기
function openFaqModal() {
    const modal = document.getElementById('faqModal');
    if (modal) {
        modal.style.display = 'block';
        
        // 실제 구글시트 URL로 설정 (여기에 실제 시트 URL을 넣으세요)
        // const faqSheetUrl = "https://docs.google.com/spreadsheets/d/1abcd.../edit#gid=0";
        const faqSheetUrl = "https://docs.google.com/spreadsheets/d/1YZKUJNqCf63gxzfnoBnWugUEi04dYUZ8LeTdtENfg4k/edit?usp=sharing";
        document.getElementById('faqIframe').src = faqSheetUrl;
    }
}

// FAQ 모달 닫기
function closeFaqModal() {
    const modal = document.getElementById('faqModal');
    if (modal) {
        modal.style.display = 'none';
    }
}

// 커리큘럼 관리 모달 열기
function openCurriculumModal() {
    const modal = document.getElementById('curriculumModal');
    const iframe = document.getElementById('curriculumIframe');
    
    if (modal && iframe) {
        // PSAC 커리큘럼 관리 시트 URL 설정
        const curriculumSheetUrl = "https://docs.google.com/spreadsheets/d/1VloYSdnC53L4cUvNTifIoQxKC6YP3IWvHzeZRQsYdGk/edit#gid=0";
        iframe.src = curriculumSheetUrl;
        
        modal.style.display = 'block';
    }
}

// 커리큘럼 관리 모달 닫기
function closeCurriculumModal() {
    const modal = document.getElementById('curriculumModal');
    if (modal) {
        modal.style.display = 'none';
    }
}

// 모달 외부 클릭시 닫기
window.onclick = function(event) {
    const faqModal = document.getElementById('faqModal');
    const curriculumModal = document.getElementById('curriculumModal');
    
    if (event.target === faqModal) {
        closeFaqModal();
    }
    if (event.target === curriculumModal) {
        closeCurriculumModal();
    }
}

document.addEventListener('keydown', function(event) {
    if (event.key !== 'Escape') {
        return;
    }

    const curriculumModal = document.getElementById('curriculumModal');
    if (curriculumModal?.style.display === 'block') {
        closeCurriculumModal();
        return;
    }

    const faqModal = document.getElementById('faqModal');
    if (faqModal?.style.display === 'block') {
        closeFaqModal();
    }
});
</script>

<!-- 인증 보호 스크립트 -->
<script>
    // DOM 요소들
    const authLoading = document.getElementById('authLoading');
    const mainContent = document.getElementById('mainContent');
    const logoutBtn = document.getElementById('logoutBtn');
    const adminUserInfo = document.getElementById('adminUserInfo');
    
    // 세션 만료 확인 함수
    function checkSessionExpiry() {
        const loginTime = localStorage.getItem('adminLoginTime');
        if (loginTime) {
            const currentTime = Date.now();
            const sessionDuration = 24 * 60 * 60 * 1000; // 24시간
            
            if (currentTime - parseInt(loginTime) > sessionDuration) {
                // 세션 만료
                localStorage.removeItem('adminLoggedIn');
                localStorage.removeItem('adminLoginTime');
                return false;
            }
            return true;
        }
        return false;
    }
    
    // 로그인 상태 확인 및 페이지 보호
    function checkAuthStatus() {
        const isLoggedIn = localStorage.getItem('adminLoggedIn');
        const isSessionValid = checkSessionExpiry();
        
        if (isLoggedIn === 'true' && isSessionValid) {
            // 로그인됨 - 메인 콘텐츠 표시
            authLoading.style.display = 'none';
            mainContent.style.display = 'block';
            
            // 로그인 시간 표시
            const loginTime = localStorage.getItem('adminLoginTime');
            if (loginTime) {
                const loginDate = new Date(parseInt(loginTime));
                adminUserInfo.textContent = `로그인: ${loginDate.toLocaleString()}`;
            }
        } else {
            // 미로그인 또는 세션 만료 - 로그인 페이지로 리다이렉트
            window.location.href = '/admin/login.html';
        }
    }
    
    // 로그아웃 처리
    function handleLogout() {
        if (confirm('로그아웃 하시겠습니까?')) {
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminLoginTime');
            window.location.href = '/admin/login.html';
        }
    }
    
    // 이벤트 리스너
    if (logoutBtn) {
        logoutBtn.addEventListener('click', handleLogout);
    }
    
    // 페이지 로드 시 인증 확인
    document.addEventListener('DOMContentLoaded', function() {
        // 약간의 지연 후 인증 확인 (로딩 효과)
        setTimeout(checkAuthStatus, 500);
    });
    
    // 세션 만료 주기적 확인 (10분마다)
    setInterval(function() {
        if (!checkSessionExpiry()) {
            alert('세션이 만료되었습니다. 다시 로그인해주세요.');
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminLoginTime');
            window.location.href = '/admin/login.html';
        }
    }, 10 * 60 * 1000); // 10분
    
    // 페이지 숨김/표시 시 세션 확인
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            checkAuthStatus();
        }
    });
</script>
