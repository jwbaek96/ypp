<style>
#contact {
    --contact-blue: #0071e8;
    --contact-navy: #1b2c49;
    --contact-muted: #77869f;
    position: relative;
    isolation: isolate;
    overflow: hidden;
    padding: 64px 24px 74px;
    background: #e4eeff;
    color: var(--contact-navy);
}
#contact::before,
#contact::after {content: "";position: absolute;z-index: -1;pointer-events: none;border-radius: 50%;}
#contact::before {width: 720px;height: 720px;top: -515px;right: -180px;background: linear-gradient(135deg, #f9fbff, #eff5fd);}
#contact::after {width: 520px;height: 520px;top: -300px;right: -345px;background: linear-gradient(135deg, #e6f0ff, #f3f8ff);}
#contact .contact-title {margin: 0 0 12px;color: var(--contact-navy);font-size: clamp(32px, 3.5vw, 44px);font-weight: 750;line-height: 1.25;}
#contact .contact-subtitle {margin: 0;color: var(--contact-muted);font-size: 16px;line-height: 1.65;}
#contact .contact-content {display: grid;grid-template-columns: minmax(0, 2.4fr) minmax(280px, 1fr);gap: 24px;align-items: stretch;}
#contact .contact-info,
#contact .contact-actions {border: 1px solid #e0eafa;border-radius: 9px;}
#contact .contact-info {padding: 0 32px;background: rgba(255, 255, 255, 0.85);}
#contact .contact-row {display: flex;align-items: flex-start;gap: 26px;padding: 24px 0;border-bottom: 1px solid #e5edf8;}
#contact .contact-row:first-child {padding: 28px 0;}
#contact .contact-row:last-child {border-bottom: none;}
#contact .contact-icon {display: flex;align-items: center;justify-content: center;flex: 0 0 52px;height: 52px;border-radius: 50%;background: #eaf5ff;color: var(--contact-blue);}
#contact .contact-icon svg {width: 26px;height: 26px;}
#contact .contact-details {min-width: 0;padding-top: 2px;}
#contact .contact-label {margin: 0 0 4px;color: #496c9e;font-size: 14px;font-weight: 500;line-height: 1.5;}
#contact .contact-number {margin: 0;color: var(--contact-blue);font-size: clamp(22px, 2.4vw, 25px);font-weight: 750;line-height: 1.3;overflow-wrap: anywhere;}
#contact .contact-number a {color: inherit;}
#contact .contact-description {margin: 4px 0 0;color: var(--contact-muted);font-size: 14px;line-height: 1.5;}
#contact .contact-email {color: var(--contact-navy);font-size: 18px;font-weight: 600;line-height: 1.5;overflow-wrap: anywhere;}
#contact .contact-address {margin: 0;color: #384d70;font-size: 16px;line-height: 1.6;overflow-wrap: anywhere;}
#contact .contact-actions {display: flex;flex-direction: column;gap: 20px;padding: 24px 22px;background: rgba(246, 250, 255, 0.65);}
#contact .contact-action {display: flex;align-items: center;gap: 28px;min-height: 67px;padding: 18px 22px;border: 1px solid #dce7f7;border-radius: 10px;background: #fff;color: var(--contact-navy);font-size: 16px;font-weight: 600;line-height: 1.4;text-decoration: none;transition: background-color 0.2s ease, border-color 0.2s ease;}
#contact .contact-action span {min-width: 0;}
#contact .contact-action-icon {width: 24px;height: 24px;flex-shrink: 0;color: var(--contact-blue);}
#contact .contact-arrow {width: 20px;height: 20px;flex-shrink: 0;margin-left: auto;color: var(--contact-blue);transition: transform 0.2s ease;}
#contact .contact-action-primary {background: #2079df;border-color: #2079df;color: #fff;}
#contact .contact-action-primary svg {color: inherit;}
#contact .contact-action:hover {background: #edf5ff;border-color: #a9caff;}
#contact .contact-action-primary:hover {background: #0966cb;border-color: #0966cb;}
#contact .contact-action:hover .contact-arrow {transform: translateX(3px);}
#contact .contact-details a:hover {text-decoration: underline;}
#contact a:focus-visible {outline: 2px solid var(--contact-blue);outline-offset: 4px;}
@media (max-width: 900px) {
    #contact .contact-content {grid-template-columns: minmax(0, 1.8fr) minmax(240px, 1fr);gap: 18px;}
    #contact .contact-info {padding: 0 22px;}
    #contact .contact-row {gap: 18px;}
    #contact .contact-actions {padding: 22px 16px;}
    #contact .contact-action {padding: 16px;gap: 16px;}
}
@media (max-width: 768px) {
    #contact {padding: 48px 20px;}
    #contact .contact-content {grid-template-columns: minmax(0, 1fr);}
    #contact .contact-actions {gap: 14px;}
    #contact .contact-number {font-size: 28px;}
}
@media (max-width: 480px) {
    #contact {padding: 40px 16px;}
    #contact .contact-header {margin-bottom: 24px;}
    #contact .contact-subtitle {font-size: 14px;}
    #contact .contact-subtitle br {display: none;}
    #contact .contact-info {padding: 0 16px;}
    #contact .contact-row,
    #contact .contact-row:first-child {gap: 14px;padding: 22px 0;}
    #contact .contact-icon {flex-basis: 42px;height: 42px;}
    #contact .contact-icon svg {width: 23px;height: 23px;}
    #contact .contact-number {font-size: 22px;}
    #contact .contact-label,
    #contact .contact-description {font-size: 13px;}
    #contact .contact-email {font-size: 16px;}
    #contact .contact-address {font-size: 14px;}
    #contact .contact-actions {padding: 16px;}
}
@media (prefers-reduced-motion: reduce) {
    #contact .contact-action,
    #contact .contact-arrow {transition: none;}
    #contact .contact-action:hover .contact-arrow {transform: none;}
}
</style>
